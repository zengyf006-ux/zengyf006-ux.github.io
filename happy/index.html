<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080913"><title>锋哥的解压场</title><style>
:root{--pink:#ff55c7;--violet:#816bff;--cyan:#2edcff;--orange:#ff9847;--green:#45efb6;--line:#ffffff1d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#070812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}button{font:inherit;color:inherit}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 10% 8%,#6946ff55,transparent 31%),radial-gradient(circle at 92% 24%,#19dfff35,transparent 27%),radial-gradient(circle at 48% 112%,#ff8d4430,transparent 36%),#070812;z-index:-2}body:after{content:"";position:fixed;inset:0;background-image:radial-gradient(#fff8 .6px,transparent .8px);background-size:4px 4px;opacity:.045;z-index:-1}.app{position:relative;width:100%;height:100dvh;overflow:hidden}.top{position:absolute;z-index:20;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;pointer-events:none}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:40px;height:40px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 10px 28px #765fff55}.name{font-size:20px;font-weight:950;letter-spacing:-.04em}.status{font-size:11px;color:#ffffff9c;margin-top:3px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;gap:7px}.stat{min-width:62px;padding:8px 10px;border:1px solid var(--line);border-radius:15px;background:#0a0c18a8;backdrop-filter:blur(16px);text-align:center}.stat b{display:block;font-size:17px}.stat small{font-size:10px;color:#ffffff8a}.tip{margin-top:9px;padding:10px 12px;border:1px solid #ffffff14;border-radius:16px;background:#ffffff0d;backdrop-filter:blur(13px);font-size:12px;color:#ffffffc2}.arena{position:absolute;z-index:2;inset:0;overflow:hidden;touch-action:none}.bubble{position:absolute;border:1px solid #ffffff50;min-width:74px;height:58px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:13px;line-height:1.1;text-align:center;color:#fff;box-shadow:0 13px 30px #0006;will-change:transform;touch-action:none;animation:fall linear forwards,bob .65s ease-in-out infinite alternate}.bubble:active{filter:brightness(1.18)}@keyframes fall{from{transform:translate3d(0,-90px,0) rotate(-5deg)}to{transform:translate3d(var(--drift),calc(100dvh + 100px),0) rotate(8deg)}}@keyframes bob{to{scale:1.045}}.bubble.pop{animation:pop .22s ease-out forwards!important;pointer-events:none}@keyframes pop{to{transform:scale(1.85);opacity:0;filter:blur(5px)}}.particle{position:absolute;z-index:9;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:burst .58s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.slash{position:absolute;z-index:8;height:7px;border-radius:999px;pointer-events:none;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#fff,#3de4ff,transparent);box-shadow:0 0 17px #3de4ff;animation:fade .28s ease-out forwards}@keyframes fade{to{opacity:0;filter:blur(4px)}}.center{position:absolute;z-index:1;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:92%}.center h1{font-size:clamp(42px,12vw,75px);letter-spacing:-.075em;line-height:.98;margin:0;font-weight:950;background:linear-gradient(180deg,#fff,#d8deff 58%,#a78aff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #8f6dff44)}.center p{margin:12px 0 0;color:#ffffffa8;font-size:14px}.bottom{position:absolute;z-index:25;left:0;right:0;bottom:0;padding:0 14px calc(max(14px,env(safe-area-inset-bottom)) + 8px)}.ragebox{padding:12px;border:1px solid var(--line);border-radius:18px;background:#090b17b8;backdrop-filter:blur(17px);margin-bottom:9px}.ragetop{display:flex;justify-content:space-between;font-size:11px;color:#ffffff91;margin-bottom:7px}.bar{height:11px;border-radius:999px;background:#ffffff12;overflow:hidden}.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--orange),#ffd04f);box-shadow:0 0 17px #ff7b6870;transition:width .12s}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}.ctrl{min-height:55px;border:1px solid var(--line);border-radius:17px;background:#ffffff12;backdrop-filter:blur(17px);font-weight:900;padding:7px}.ctrl small{display:block;font-size:10px;color:#ffffff9b;margin-top:3px;font-weight:600}.ctrl.main{background:linear-gradient(135deg,#ff55c73c,#816bff42,#2edcff3a)}.ctrl.warn{background:linear-gradient(135deg,#ff984741,#ff55c728)}.ctrl.good{background:linear-gradient(135deg,#45efb62f,#2edcff2b)}.ctrl:active{transform:scale(.97);filter:brightness(1.15)}.ctrl.lock{opacity:.45}.toast{position:absolute;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);padding:15px 20px;max-width:86%;white-space:nowrap;border-radius:20px;border:1px solid var(--line);background:#05060dbd;backdrop-filter:blur(17px);font-weight:900;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.overlay{position:absolute;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#05060bc9;backdrop-filter:blur(13px)}.card{width:min(100%,520px);padding:22px;border:1px solid var(--line);border-radius:28px;background:#0a0d1bcf;box-shadow:0 28px 80px #0007}.card h2{font-size:clamp(38px,10vw,58px);letter-spacing:-.065em;line-height:1.02;margin:0 0 12px}.card p{font-size:14px;line-height:1.7;color:#ffffffb5}.startgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.start{min-height:58px;border:1px solid var(--line);border-radius:18px;background:#ffffff10;font-weight:900}.start.main{border:0;background:linear-gradient(135deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 14px 32px #755fff66}.start:active{transform:scale(.98)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.tag{padding:8px 10px;border-radius:13px;border:1px solid #ffffff14;background:#ffffff0b;font-size:11px;color:#ffffffa8}.flash{position:absolute;z-index:60;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .2s ease-out}@keyframes flash{0%{opacity:.55}100%{opacity:0}}.shake{animation:shake .22s linear}@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.hidden{display:none!important}@media(max-width:390px){.name{font-size:18px}.status{max-width:46vw}.stat{min-width:56px;padding:8px 7px}.controls{grid-template-columns:1.15fr 1fr 1fr}.ctrl{font-size:13px}.tip{font-size:11px}}
</style></head><body><main class="app" id="app"><section class="arena" id="arena"></section><div class="center" id="center"><h1>狠狠干它。</h1><p>点爆，或者用手指一路划过去。</p></div><header class="top"><div class="toprow"><div class="brand"><div class="logo">⚡</div><div><div class="name">锋哥的解压场</div><div class="status" id="status">上手就干，不解释。</div></div></div><div class="stats"><div class="stat"><b id="score">0</b><small>干碎</small></div><div class="stat"><b id="combo">x1</b><small>连击</small></div></div></div><div class="tip">直接点破气泡；按住手指划过屏幕可以连续爆。</div></header><footer class="bottom"><div class="ragebox"><div class="ragetop"><span>怒气槽</span><span id="rageText">再狠狠干几下</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="controls"><button class="ctrl main lock" id="clear"><span>一键清屏</span><small>怒气满了再放</small></button><button class="ctrl warn" id="hole"><span>黑洞吸走</span><small id="cool">可以使用</small></button><button class="ctrl good" id="reset"><span>重开一局</span><small>清空分数</small></button></div></footer><div class="toast" id="toast"></div><div class="flash" id="flash"></div><section class="overlay" id="overlay"><div class="card"><h2>今天不讲道理，<br>只负责狠狠干它。</h2><p>点一下开始后，直接用手点或划。音效会在第一次点击后开启；手机浏览器支持震动时也会触发。</p><div class="startgrid"><button class="start main" id="start">开始狠狠干</button><button class="start" id="quiet">静音开始</button></div><div class="meta"><span class="tag">免登录</span><span class="tag">手机直接玩</span><span class="tag">不收集数据</span></div></div></section></main><script>
(()=>{const $=s=>document.querySelector(s),arena=$('#arena'),app=$('#app'),overlay=$('#overlay'),scoreEl=$('#score'),comboEl=$('#combo'),fill=$('#fill'),rageText=$('#rageText'),status=$('#status'),toast=$('#toast'),flash=$('#flash'),clearBtn=$('#clear'),cool=$('#cool'),center=$('#center');const WORDS=['503','催催催','没额度','改需求','消息轰炸','睡不够','破事太多','又要解释','马上给我','已读不回','临时加活','周一'];const COLORS=['#ff55c7','#816bff','#2edcff','#ff9847','#45efb6','#f5d34d'];let running=false,sound=true,score=0,combo=1,hits=0,rage=0,comboTimer=0,spawnTimer=0,cooldown=0,audio=null,drag=false,last=null,hintTimer=0;const rand=a=>a[(Math.random()*a.length)|0];function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),850)}function vibe(p){navigator.vibrate?.(p)}function audioInit(){if(!sound)return;const AC=window.AudioContext||window.webkitAudioContext;if(!audio&&AC)audio=new AC;if(audio?.state==='suspended')audio.resume()}function tone(f,d=.07,type='triangle',g=.035,slide=-80){if(!sound||!audio)return;const n=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),n+d);v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+.008);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v).connect(audio.destination);o.start(n);o.stop(n+d+.02)}function popSound(){tone(540+Math.random()*140,.065,'triangle',.035,-150);tone(190,.05,'sine',.018,-40)}function boom(){tone(125,.2,'square',.045,-75);tone(60,.23,'sine',.04,-20)}function update(){scoreEl.textContent=score;comboEl.textContent='x'+combo;fill.style.width=rage+'%';if(rage>=100){clearBtn.classList.remove('lock');rageText.textContent='满了，放手清屏';}else{clearBtn.classList.add('lock');rageText.textContent=rage>72?'快满了，再狠狠干几下':'再狠狠干几下';}}function spawn(){if(!running)return;const b=document.createElement('button'),h=Math.floor(Math.random()*360),dur=3.3+Math.random()*2;b.className='bubble';b.textContent=rand(WORDS);b.style.left=(4+Math.random()*78)+'%';b.style.top='-70px';b.style.setProperty('--drift',(Math.random()*70-35)+'px');b.style.animationDuration=dur+'s,.65s';b.style.background=`radial-gradient(circle at 30% 24%,hsla(${h},96%,76%,.97),hsla(${h},82%,43%,.76))`;b.dataset.hue=h;arena.appendChild(b);b.addEventListener('pointerdown',e=>{e.preventDefault();smash(b,e.clientX,e.clientY)});b.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];smash(b,t.clientX,t.clientY)},{passive:false});setTimeout(()=>b.remove(),(dur+.5)*1000)}function burst(x,y,h=210,n=18){for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=32+Math.random()*70;p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=rand(COLORS);p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');arena.appendChild(p);setTimeout(()=>p.remove(),620)}}function smash(b,x,y){if(!running||!b?.isConnected||b.classList.contains('pop'))return;b.classList.add('pop');const r=b.getBoundingClientRect(),px=x||r.left+r.width/2,py=y||r.top+r.height/2;burst(px,py,+b.dataset.hue||210,16+combo*2);popSound();vibe(combo>4?[12,18,12]:9);score++;hits++;combo=1+Math.floor(hits/4);rage=Math.min(100,rage+2.3+combo*.75);status.textContent=combo>5?'很好，这波像在算总账。':rand(['漂亮。','继续狠狠干。','这一下爽。','别留情。','给它干碎。']);update();clearTimeout(comboTimer);comboTimer=setTimeout(()=>{hits=0;combo=1;status.textContent='继续狠狠干，不要停。';update()},1250);setTimeout(()=>b.remove(),190)}function slash(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy);if(l<8)return;const s=document.createElement('i');s.className='slash';s.style.left=x1+'px';s.style.top=y1+'px';s.style.width=l+'px';s.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;arena.appendChild(s);setTimeout(()=>s.remove(),300)}function hitAt(x,y){const el=document.elementFromPoint(x,y);const b=el?.closest?.('.bubble');if(b)smash(b,x,y)}arena.addEventListener('pointerdown',e=>{if(!running)return;e.preventDefault();drag=true;last={x:e.clientX,y:e.clientY};hitAt(e.clientX,e.clientY);audioInit()},{passive:false});arena.addEventListener('pointermove',e=>{if(!drag||!running)return;e.preventDefault();slash(last.x,last.y,e.clientX,e.clientY);hitAt(e.clientX,e.clientY);last={x:e.clientX,y:e.clientY}},{passive:false});window.addEventListener('pointerup',()=>{drag=false;last=null});arena.addEventListener('touchmove',e=>{if(!running)return;e.preventDefault();const t=e.touches[0];if(last){slash(last.x,last.y,t.clientX,t.clientY);hitAt(t.clientX,t.clientY)}last={x:t.clientX,y:t.clientY}},{passive:false});window.addEventListener('touchend',()=>{last=null});clearBtn.onclick=()=>{if(rage<100){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');toastMsg('怒气还没满，再狠狠干几下');return}rage=0;boom();vibe([18,25,18]);flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');document.querySelectorAll('.bubble').forEach(b=>{const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,+b.dataset.hue||210,15);b.remove();score++});status.textContent='清屏了。终于安静一点。';toastMsg('一键清屏，爽。');update()};$('#hole').onclick=()=>{if(cooldown>0){toastMsg('黑洞还在冷却');return}cooldown=10;boom();vibe([20,30,20]);toastMsg('黑洞开饭了');status.textContent='全部吸走，别给它们留位置。';const cx=innerWidth/2,cy=innerHeight*.48;document.querySelectorAll('.bubble').forEach((b,i)=>{const r=b.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);b.style.transition=`transform ${.45+i*.015}s cubic-bezier(.7,0,1,1),opacity .45s`;b.style.animation='none';b.style.transform=`translate(${dx}px,${dy}px) scale(0)`;b.style.opacity='0';setTimeout(()=>{if(b.isConnected){b.remove();score++;update()}},520+i*12)})};$('#reset').onclick=()=>{document.querySelectorAll('.bubble,.particle,.slash').forEach(x=>x.remove());score=0;combo=1;hits=0;rage=0;status.textContent='重开了，重新狠狠干。';update();toastMsg('已重开')};function loop(){if(!running)return;spawnTimer+=16;if(spawnTimer>390){spawnTimer=0;spawn();if(Math.random()<.18)setTimeout(spawn,120)}if(cooldown>0){cooldown=Math.max(0,cooldown-.016);cool.textContent=cooldown?'冷却 '+cooldown.toFixed(1)+'s':'可以使用'}hintTimer+=16;if(hintTimer>1700)center.style.opacity=Math.max(0,1-(hintTimer-1700)/1200);requestAnimationFrame(loop)}function start(quiet=false){sound=!quiet;audioInit();overlay.classList.add('hidden');running=true;score=0;combo=1;hits=0;rage=0;hintTimer=0;center.style.opacity=1;status.textContent='狠狠干，不用想别的。';update();if(sound){tone(430,.08,'triangle',.035,180);setTimeout(()=>tone(650,.06,'triangle',.03,-80),90)}for(let i=0;i<5;i++)setTimeout(spawn,i*180);requestAnimationFrame(loop)}$('#start').onclick=()=>start(false);$('#quiet').onclick=()=>start(true);update()})();
</script></body></html>
