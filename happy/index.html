<style>

.top{position:absolute;z-index:30;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;pointer-events:none}.toprow{display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:41px;height:41px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 10px 30px #725cff55}.name{font-size:20px;font-weight:950;letter-spacing:-.045em}.status{font-size:11px;color:#ffffff9d;margin-top:3px;max-width:43vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;gap:6px}.stat{min-width:55px;padding:8px 8px;border:1px solid var(--line);border-radius:14px;background:#080b18aa;backdrop-filter:blur(16px);text-align:center}.stat b{display:block;font-size:16px;line-height:1}.stat small{font-size:9px;color:#ffffff8d}.tip{margin-top:9px;padding:9px 11px;border:1px solid #ffffff14;border-radius:15px;background:#ffffff0d;backdrop-filter:blur(13px);font-size:11px;color:#ffffffc3;display:flex;align-items:center;justify-content:space-between;gap:8px}.tip span{white-space:nowrap}.tip .legend{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.voice-indicator{pointer-events:auto;border:1px solid #ffffff18;background:#ffffff0c;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;flex:none}
.center{position:absolute;z-index:1;left:50%;top:48%;transform:translate(-50%,-50%);width:90%;text-align:center;pointer-events:none}.center h1{margin:0;font-size:clamp(42px,12vw,76px);line-height:.98;letter-spacing:-.075em;font-weight:950;background:linear-gradient(180deg,#fff,#d9e1ff 47%,#a683ff 74%,#48dfff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #765cff44)}.center p{margin:12px 0 0;color:#ffffffa6;font-size:13px}
.core{position:absolute;z-index:5;border:0;background:transparent;padding:0;display:grid;place-items:center;touch-action:none;will-change:transform;filter:drop-shadow(0 12px 26px #0009)}.core .shell{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;overflow:visible;transition:.12s transform,.12s filter}.core .shell:before,.core .shell:after{content:"";position:absolute;border-radius:50%;inset:7%;border:2px solid #ffffff70;box-shadow:0 0 18px currentColor,inset 0 0 20px #ffffff22;animation:spin 4s linear infinite}.core .shell:after{inset:20%;border-style:dashed;animation-direction:reverse;animation-duration:2.8s;opacity:.75}.core .glyph{font-size:29px;font-weight:950;text-shadow:0 0 14px #fff;z-index:2}.core .hp{position:absolute;left:12%;right:12%;bottom:-9px;height:5px;border-radius:999px;background:#0008;overflow:hidden;border:1px solid #ffffff26}.core .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4f8a,#ffd54d);transition:width .15s}.core.hit .shell{transform:scale(1.15);filter:brightness(1.3)}.core.dead{pointer-events:none;animation:corePop .25s ease-out forwards}.core.boss{z-index:8}.core.boss .shell:before{border-width:4px;animation-duration:2.4s}.core.boss .shell:after{inset:25%;border-width:3px}.core.boss .glyph{font-size:44px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes corePop{to{transform:scale(1.9);opacity:0;filter:blur(6px)}}
.particle{position:absolute;z-index:15;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .72s cubic-bezier(.1,.7,.25,1) forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.ring{position:absolute;z-index:12;border:3px solid currentColor;border-radius:50%;pointer-events:none;animation:ring .58s ease-out forwards;box-shadow:0 0 25px currentColor}@keyframes ring{from{transform:scale(.15);opacity:.9}to{transform:scale(1.7);opacity:0}}.slash{position:absolute;z-index:14;height:7px;border-radius:999px;pointer-events:none;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#fff,#55e6ff,#9c77ff,transparent);box-shadow:0 0 20px #55e6ff;animation:fade .27s ease-out forwards}@keyframes fade{to{opacity:0;filter:blur(4px)}}.float{position:absolute;z-index:18;pointer-events:none;font-weight:950;text-shadow:0 3px 12px #000;animation:floatUp .8s ease-out forwards}@keyframes floatUp{to{transform:translateY(-54px) scale(1.1);opacity:0}}
.bottom{position:absolute;z-index:35;left:0;right:0;bottom:0;padding:0 14px calc(max(14px,env(safe-area-inset-bottom)) + 8px)}.panel{padding:11px 12px;border:1px solid var(--line);border-radius:18px;background:#080b18bd;backdrop-filter:blur(18px);margin-bottom:8px}.paneltop{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#ffffff95;margin-bottom:7px}.bar{height:10px;border-radius:999px;background:#ffffff12;overflow:hidden}.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold));box-shadow:0 0 18px #ff7b6860;transition:width .13s}.controls{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:7px}.ctrl{min-height:54px;border:1px solid var(--line);border-radius:16px;background:#ffffff10;backdrop-filter:blur(16px);font-weight:900;padding:7px;font-size:12px}.ctrl small{display:block;font-size:9px;color:#ffffff96;margin-top:3px;font-weight:600}.ctrl.main{background:linear-gradient(135deg,#ff4fc33b,#ff8a4542,#ffd84b3a)}.ctrl.blue{background:linear-gradient(135deg,#27dfff2f,#3b82ff32)}.ctrl.violet{background:linear-gradient(135deg,#775cff40,#ff4fc32c)}.ctrl:active{transform:scale(.97);filter:brightness(1.15)}.ctrl.lock{opacity:.43}.toast{position:absolute;z-index:80;left:50%;top:47%;transform:translate(-50%,-50%) scale(.9);padding:16px 20px;max-width:86%;border-radius:20px;border:1px solid var(--line);background:#05060dc7;backdrop-filter:blur(18px);font-weight:900;opacity:0;pointer-events:none;transition:.18s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.banner{position:absolute;z-index:70;left:50%;top:25%;transform:translate(-50%,-20px);padding:13px 20px;border-radius:999px;background:linear-gradient(90deg,#ff4fc3dd,#775cffdd,#27dfffdd);font-weight:950;letter-spacing:.08em;opacity:0;pointer-events:none;box-shadow:0 12px 38px #735cff55}.banner.show{animation:banner .9s ease-out}@keyframes banner{0%{opacity:0;transform:translate(-50%,-25px) scale(.8)}20%,75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,15px) scale(1.05)}}.flash{position:absolute;z-index:60;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .22s ease-out}@keyframes flash{0%{opacity:.55}100%{opacity:0}}.shake{animation:shake .24s linear}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.overlay{position:absolute;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#04050bcc;backdrop-filter:blur(13px)}.card{width:min(100%,530px);padding:22px;border:1px solid var(--line);border-radius:28px;background:#090c1bd5;box-shadow:0 28px 80px #0008}.card h2{margin:0 0 12px;font-size:clamp(38px,10vw,58px);line-height:1.02;letter-spacing:-.065em}.card p{margin:0;color:#ffffffb5;font-size:14px;line-height:1.7}.startgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:9px;margin-top:16px}.start{min-height:58px;border:1px solid var(--line);border-radius:18px;background:#ffffff10;font-weight:900}.start.main{border:0;background:linear-gradient(135deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 14px 34px #735cff66}.start:active{transform:scale(.98)}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.tag{padding:8px 10px;border-radius:13px;border:1px solid #ffffff14;background:#ffffff0b;font-size:10px;color:#ffffffaa}.hidden{display:none!important}@media(max-width:410px){.name{font-size:18px}.status{max-width:39vw}.stat{min-width:50px;padding:8px 6px}.controls{grid-template-columns:1.2fr 1fr 1fr 1fr}.ctrl{font-size:11px;padding:6px}.tip{font-size:10px}}

<body>
<main class="app" id="app"><div class="grid"></div><section class="arena" id="arena"></section><div class="center" id="center"><h1>情绪反应堆。</h1><p>击穿能量核心，把脑子里的噪音转换成超载能量。</p></div><header class="top"><div class="toprow"><div class="brand"><div class="logo">◉</div><div><div class="name">锋哥的反应堆</div><div class="status" id="status">系统待命。别想别的，直接击穿。</div></div></div><div class="stats"><div class="stat"><b id="score">0</b><small>能量</small></div><div class="stat"><b id="combo">x1</b><small>连击</small></div><div class="stat"><b id="stage">1</b><small>阶段</small></div></div></div><div class="tip"><span class="legend">✦普通　ϟ连锁　◴慢放　⬡护盾　◉高压核心</span><button class="voice-indicator" id="voiceTop">语音：开</button></div></header><footer class="bottom"><div class="panel"><div class="paneltop"><span>超载能量</span><span id="energyText">继续击穿核心</span></div><div class="bar"><div class="fill" id="energyFill"></div></div></div><div class="controls"><button class="ctrl main lock" id="overload"><span>释放超载</span><small>满能量清场</small></button><button class="ctrl blue" id="freeze"><span>冻结 3 秒</span><small id="freezeText">可以使用</small></button><button class="ctrl violet" id="voice"><span>语音播报</span><small id="voiceText">已开启</small></button><button class="ctrl" id="reset"><span>重开</span><small>清空进度</small></button></div></footer><div class="toast" id="toast"></div><div class="banner" id="banner"></div><div class="flash" id="flash"></div><section class="overlay" id="overlay"><div class="card"><h2>不是切水果，<br>是摧毁一个反应堆。</h2><p>核心会变化、会连锁、会套盾，还会出现需要连续击破的高压核心。达到连击、阶段和Boss突破时，系统会用中文语音鼓励你。</p><div class="startgrid"><button class="start main" id="start">启动反应堆</button><button class="start" id="quiet">静音启动</button></div><div class="meta"><span class="tag">免登录</span><span class="tag">手机直接玩</span><span class="tag">中文语音成就</span><span class="tag">Boss与阶段升级</span></div></div></section></main>
<script>
(()=>{const arena=document.getElementById('arena'),app=document.getElementById('app'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),stageEl=document.getElementById('stage'),energyFill=document.getElementById('energyFill'),energyText=document.getElementById('energyText'),statusEl=document.getElementById('status'),toast=document.getElementById('toast'),banner=document.getElementById('banner'),flash=document.getElementById('flash'),overloadBtn=document.getElementById('overload'),freezeBtn=document.getElementById('freeze'),freezeText=document.getElementById('freezeText'),voiceBtn=document.getElementById('voice'),voiceText=document.getElementById('voiceText'),voiceTop=document.getElementById('voiceTop'),resetBtn=document.getElementById('reset'),center=document.getElementById('center');const TYPES={normal:{glyph:'✦',hp:1,score:1,size:72,colors:['#39ddff','#635cff']},chain:{glyph:'ϟ',hp:1,score:2,size:76,colors:['#ffd84b','#ff7d45']},time:{glyph:'◴',hp:1,score:2,size:78,colors:['#8fe9ff','#3b82ff']},shield:{glyph:'⬡',hp:2,score:3,size:82,colors:['#a58bff','#ff55c7']},boost:{glyph:'◎',hp:1,score:2,size:74,colors:['#45efba','#27dfff']},boss:{glyph:'◉',hp:16,score:16,size:124,colors:['#ff467d','#7b5cff']}};const state={running:false,sound:true,voice:true,audio:null,voices:[],score:0,combo:1,hits:0,stage:1,energy:0,last:0,spawnAcc:0,startTime:0,items:new Map(),order:[],id:1,pointer:false,lastPoint:null,slowUntil:0,freezeCd:0,boss:null,nextBoss:30,spoken:new Set(),centerFade:0};const now=()=>performance.now(),rnd=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function showToast(t,ms=900){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),ms)}function showBanner(t){banner.textContent=t;banner.classList.remove('show');void banner.offsetWidth;banner.classList.add('show')}function shake(){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake')}function blink(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}function vibrate(p){if(navigator.vibrate)navigator.vibrate(p)}function initAudio(){if(!state.sound)return;const AC=window.AudioContext||window.webkitAudioContext;if(!state.audio&&AC)state.audio=new AC;if(state.audio&&state.audio.state==='suspended')state.audio.resume()}function tone(f,d=.08,type='triangle',g=.025,slide=0){if(!state.sound||!state.audio)return;const t=state.audio.currentTime,o=state.audio.createOscillator(),v=state.audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(state.audio.destination);o.start(t);o.stop(t+d+.03)}function noise(d=.06,g=.015,cut=1800){if(!state.sound||!state.audio)return;const c=state.audio,b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),v=c.createGain(),t=c.currentTime;s.buffer=b;f.type='lowpass';f.frequency.value=cut;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(v).connect(c.destination);s.start(t);s.stop(t+d+.03)}const sfx={hit(){tone(520+rnd(0,160),.065,'triangle',.03,-130);tone(190,.05,'sine',.015,-35);noise(.045,.012,2200)},shield(){tone(180,.09,'square',.027,-40);noise(.06,.018,1100)},chain(){tone(320,.12,'sawtooth',.022,520);tone(880,.1,'triangle',.02,-240);noise(.08,.014,2600)},time(){tone(760,.15,'sine',.025,-180);tone(1120,.12,'triangle',.016,-240)},boss(){tone(95,.22,'square',.05,-45);tone(52,.28,'sine',.05,-15);noise(.14,.022,800)},overload(){tone(70,.32,'sine',.06,120);tone(150,.28,'square',.045,-100);tone(820,.25,'sawtooth',.02,420);noise(.22,.035,1200)}};function loadVoices(){state.voices=speechSynthesis.getVoices()||[]}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speak(text,priority=true){if(!state.voice||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text),zh=state.voices.find(v=>/zh-CN|Chinese|普通话|Mandarin/i.test(v.lang+' '+v.name))||state.voices.find(v=>/^zh/i.test(v.lang));if(zh)u.voice=zh;u.lang='zh-CN';u.rate=.98;u.pitch=1.02;u.volume=.9;if(priority)speechSynthesis.cancel();speechSynthesis.speak(u)}function sayOnce(key,text){if(state.spoken.has(key))return;state.spoken.add(key);speak(text)}function updateHUD(){scoreEl.textContent=state.score;comboEl.textContent='x'+state.combo;stageEl.textContent=state.stage;energyFill.style.width=state.energy+'%';energyText.textContent=state.energy>=100?'超载已满，释放它':state.energy>70?'能量接近临界':'继续击穿核心';overloadBtn.classList.toggle('lock',state.energy<100);voiceText.textContent=state.voice?'已开启':'已关闭';voiceTop.textContent='语音：'+(state.voice?'开':'关')}function setStatus(t){statusEl.textContent=t}function floatText(x,y,t,color='#fff'){const e=document.createElement('div');e.className='float';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';e.style.color=color;arena.appendChild(e);setTimeout(()=>e.remove(),820)}function ring(x,y,color,size=76){const e=document.createElement('i');e.className='ring';e.style.left=(x-size/2)+'px';e.style.top=(y-size/2)+'px';e.style.width=size+'px';e.style.height=size+'px';e.style.color=color;arena.appendChild(e);setTimeout(()=>e.remove(),620)}function particles(x,y,colors,n=18,power=1){for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=rnd(35,82)*power;p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=colors[(Math.random()*colors.length)|0];p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');arena.appendChild(p);setTimeout(()=>p.remove(),760)}}function slash(x1,y1,x2,y2){const l=Math.hypot(x2-x1,y2-y1);if(l<14)return;const e=document.createElement('i');e.className='slash';e.style.left=x1+'px';e.style.top=y1+'px';e.style.width=l+'px';e.style.transform=`rotate(${Math.atan2(y2-y1,x2-x1)}rad)`;arena.appendChild(e);setTimeout(()=>e.remove(),300)}function chooseType(){const r=Math.random();if(r<.56)return'normal';if(r<.68)return'chain';if(r<.78)return'time';if(r<.9)return'shield';return'boost'}function createCore(kind='normal'){const cfg=TYPES[kind],el=document.createElement('button'),id='c'+state.id++,x=rnd(10,Math.max(12,innerWidth-cfg.size-10)),drift=rnd(-36,36),duration=Math.max(3.4,7.1-state.stage*.28+(kind==='shield'?.6:0));el.className='core'+(kind==='boss'?' boss':'');el.dataset.id=id;el.style.width=cfg.size+'px';el.style.height=cfg.size+'px';el.innerHTML=`<span class="shell" style="color:${cfg.colors[0]};background:radial-gradient(circle at 35% 30%,#ffffff55,${cfg.colors[0]}cc 30%,${cfg.colors[1]}aa 67%,#050611 70%)"><b class="glyph">${cfg.glyph}</b>${cfg.hp>1?'<span class="hp"><i></i></span>':''}</span>`;arena.appendChild(el);const item={id,kind,cfg,el,x,drift,duration,born:now(),hp:cfg.hp,maxHp:cfg.hp,dead:false};state.items.set(id,item);state.order.push(id);el.addEventListener('pointerdown',e=>{e.preventDefault();hitCore(item)});return item}function spawnBoss(){if(state.boss)return;const b=createCore('boss');b.x=innerWidth/2-TYPES.boss.size/2;b.duration=999;b.born=now();state.boss=b;showBanner('高压核心出现');showToast('Boss核心：连续击穿它',1100);setStatus('高压核心出现，别停。');sfx.boss();vibrate([20,30,20]);speak('注意，高压核心出现。连续击穿它。')}function remove(item){if(!item||item.dead)return;item.dead=true;state.items.delete(item.id);item.el.remove();if(state.boss===item)state.boss=null}function nearbyChain(cx,cy){for(const id of [...state.order]){const it=state.items.get(id);if(!it||it.kind==='boss')continue;const r=it.el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;if(Math.hypot(x-cx,y-cy)<155)destroy(it,true)}}function gain(points,energy){state.score+=points;state.hits++;state.combo=1+Math.floor(state.hits/4);state.energy=clamp(state.energy+energy+state.combo*.45,0,100);const newStage=1+Math.floor(state.score/35);if(newStage>state.stage){state.stage=newStage;showBanner('阶段 '+state.stage+' 突破');sfx.chain();vibrate([10,15,10]);speak(`第${state.stage}阶段突破。很好，继续保持。`)}if(state.score>=state.nextBoss&&!state.boss){state.nextBoss+=55;spawnBoss()}if(state.score>=10)sayOnce('s10','不错，第一层已经压下去了。');if(state.score>=50)sayOnce('s50','已经清掉五十点能量，这一波很稳。');if(state.score>=100)sayOnce('s100','你已经清空一整轮，做得很好。');if(state.combo>=6)sayOnce('c6','连击起来了，保持住。');if(state.combo>=12)sayOnce('c12','十二连击，节奏完全在你手里。');if(state.energy>=100)sayOnce('full'+state.stage,'超载已经充满。现在释放它。');clearTimeout(gain.t);gain.t=setTimeout(()=>{state.hits=0;state.combo=1;comboEl.textContent='x1'},1450);updateHUD()}function destroy(item,fromChain){if(!item||item.dead)return;const r=item.el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,c=item.cfg.colors;item.el.classList.add('dead');particles(x,y,[c[0],c[1],'#fff','#ffd84b'],item.kind==='boss'?38:18,item.kind==='boss'?1.45:1);ring(x,y,c[0],item.kind==='boss'?130:78);setTimeout(()=>remove(item),230);let pts=item.cfg.score,en=3.2;if(item.kind==='chain'){sfx.chain();nearbyChain(x,y);floatText(x,y,'连锁','#ffd84b');en+=8}else if(item.kind==='time'){state.slowUntil=now()+3200;sfx.time();showToast('时间核心：全场慢放',850);floatText(x,y,'慢放','#8fe9ff');en+=5}else if(item.kind==='boost'){state.energy=clamp(state.energy+20,0,100);floatText(x,y,'能量 +20','#45efba');en+=4}else if(item.kind==='shield'){floatText(x,y,'护盾击穿','#c7b7ff');en+=7}else if(item.kind==='boss'){pts+=state.stage*5;en=35;sfx.boss();blink();shake();showBanner('高压核心击穿');showToast('Boss突破，这一波你赢了',1200);setStatus('核心击穿，漂亮。');speak('高压核心已经击穿。这一波，你赢了。');state.nextBoss=Math.max(state.nextBoss,state.score+45)}else floatText(x,y,'+'+pts,'#fff');gain(pts,fromChain?1.2:en)}function hitCore(item){if(!state.running||!item||item.dead)return;initAudio();const r=item.el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;item.hp--;item.el.classList.add('hit');setTimeout(()=>item.el&&item.el.classList.remove('hit'),110);if(item.kind==='shield'||item.kind==='boss')sfx.shield();else sfx.hit();vibrate(item.kind==='boss'?12:8);if(item.hp>0){floatText(x,y,item.kind==='boss'?`核心 ${item.hp}`:'护盾破裂','#ffd84b');const hp=item.el.querySelector('.hp i');if(hp)hp.style.width=(item.hp/item.maxHp*100)+'%';return}destroy(item,false)}function releaseOverload(){if(state.energy<100){shake();showToast('能量还没满，继续击穿。');return}initAudio();state.energy=0;sfx.overload();vibrate([22,28,22]);blink();shake();showBanner('超载释放');speak('超载释放。清空这一波。');for(const id of [...state.order]){const it=state.items.get(id);if(!it)continue;if(it.kind==='boss'){it.hp=Math.max(0,it.hp-6);const hp=it.el.querySelector('.hp i');if(hp)hp.style.width=(it.hp/it.maxHp*100)+'%';if(it.hp<=0)destroy(it,true)}else destroy(it,true)}setStatus('全场清空，脑子安静一秒。');showToast('超载清场',1000);updateHUD()}function freeze(){const t=now();if(t<state.freezeCd){showToast('冻结还在冷却。');return}state.freezeCd=t+10000;state.slowUntil=t+3200;sfx.time();vibrate([10,14,10]);speak('全场冻结三秒。慢慢打。');showToast('全场冻结 3 秒',900)}function toggleVoice(){state.voice=!state.voice;if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();updateHUD();showToast(state.voice?'语音播报已开启':'语音播报已关闭')}function reset(){for(const id of [...state.order])remove(state.items.get(id));state.order=[];state.items.clear();state.score=0;state.combo=1;state.hits=0;state.stage=1;state.energy=0;state.startTime=now();state.nextBoss=30;state.boss=null;state.spoken.clear();state.slowUntil=0;state.freezeCd=0;state.centerFade=0;center.style.opacity='1';setStatus('系统重置。重新击穿。');updateHUD()}overloadBtn.addEventListener('click',releaseOverload);freezeBtn.addEventListener('click',freeze);voiceBtn.addEventListener('click',toggleVoice);voiceTop.addEventListener('click',toggleVoice);resetBtn.addEventListener('click',reset);function handleMove(e){if(!state.pointer)return;const p=e.touches?e.touches[0]:e,target=document.elementFromPoint(p.clientX,p.clientY),core=target&&target.closest?target.closest('.core'):null;if(core){const it=state.items.get(core.dataset.id);if(it)hitCore(it)}if(state.lastPoint)slash(state.lastPoint.x,state.lastPoint.y,p.clientX,p.clientY);state.lastPoint={x:p.clientX,y:p.clientY}}function down(e){if(!state.running)return;e.preventDefault();state.pointer=true;state.lastPoint=null;initAudio();handleMove(e)}function moveEvt(e){if(!state.pointer)return;e.preventDefault();handleMove(e)}function up(){state.pointer=false;state.lastPoint=null}arena.addEventListener('pointerdown',down,{passive:false});arena.addEventListener('pointermove',moveEvt,{passive:false});window.addEventListener('pointerup',up,{passive:true});arena.addEventListener('touchstart',down,{passive:false});arena.addEventListener('touchmove',moveEvt,{passive:false});window.addEventListener('touchend',up,{passive:true});function updatePositions(t){const slow=t<state.slowUntil?.38:1;for(const id of [...state.order]){const it=state.items.get(id);if(!it)continue;if(it.kind==='boss'){const bx=innerWidth/2-it.cfg.size/2+Math.sin(t/700)*Math.min(90,innerWidth*.23),by=innerHeight*.34+Math.sin(t/950)*28;it.el.style.transform=`translate3d(${bx}px,${by}px,0)`;continue}const life=(t-it.born)/1000,progress=life/it.duration,scaled=progress*slow+(1-slow)*Math.min(progress,.48);if(progress>1.08){remove(it);continue}const x=it.x+it.drift*scaled,y=-100+scaled*(innerHeight+190);it.el.style.transform=`translate3d(${x}px,${y}px,0)`}}function tick(t){if(!state.running)return;if(!state.last){state.last=t;state.startTime=t}const dt=Math.min(.03,(t-state.last)/1000);state.last=t;state.spawnAcc+=dt;const interval=Math.max(.2,.62-state.stage*.035);while(state.spawnAcc>=interval){state.spawnAcc-=interval;if(!state.boss||Math.random()>.28)createCore(chooseType())}freezeText.textContent=state.freezeCd>t?((state.freezeCd-t)/1000).toFixed(1)+'s':'可以使用';if(state.centerFade<1){state.centerFade+=dt*.28;center.style.opacity=Math.max(0,1-state.centerFade).toFixed(2)}updatePositions(t);requestAnimationFrame(tick)}function start(quiet){state.sound=!quiet;state.voice=!quiet;initAudio();overlay.classList.add('hidden');state.running=true;state.last=0;reset();if(!quiet){sfx.chain();setTimeout(()=>speak('锋哥，反应堆已启动。别想别的，直接击穿。'),120)}requestAnimationFrame(tick)}document.getElementById('start').addEventListener('click',()=>start(false));document.getElementById('quiet').addEventListener('click',()=>start(true));updateHUD()})();
