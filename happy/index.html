<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070712"><title>锋哥今天不用动</title><style>:root{--t:#f8f8ff;--m:rgba(245,246,255,.62)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070712;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(115,73,255,.35),transparent 34%),radial-gradient(circle at 88% 18%,rgba(0,218,255,.24),transparent 30%),radial-gradient(circle at 50% 115%,rgba(255,124,51,.2),transparent 38%),#070712;z-index:-3}.orb{position:absolute;border-radius:50%;filter:blur(65px);opacity:.55;animation:float 15s ease-in-out infinite}.o1{width:55vw;height:55vw;background:#6044ff;left:-20vw;top:-16vw}.o2{width:48vw;height:48vw;background:#00d7e8;right:-22vw;top:28vh;animation-delay:-5s}.o3{width:44vw;height:44vw;background:#ff7c35;left:28vw;bottom:-25vw;animation-delay:-9s}@keyframes float{50%{transform:translate3d(25px,-28px,0) scale(1.08)}}.grain{position:fixed;inset:0;z-index:-2;opacity:.055;background-image:radial-gradient(rgba(255,255,255,.9) .6px,transparent .8px);background-size:4px 4px}.shell{position:relative;width:min(92vw,620px);height:min(88dvh,820px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.46);letter-spacing:.12em;white-space:nowrap}.title{font-size:clamp(42px,11vw,70px);line-height:1.02;letter-spacing:-.06em;font-weight:950;margin:0;background:linear-gradient(180deg,#fff,#dbe1ff 56%,#a98bff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(143,98,255,.25));animation:breathe 4.5s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.025);filter:drop-shadow(0 0 38px rgba(98,207,255,.28))}}.sub{margin:16px 0 0;color:var(--m);font-size:15px}.stage{position:relative;width:100%;height:280px;margin-top:28px;border:1px solid rgba(255,255,255,.12);border-radius:32px;background:rgba(255,255,255,.055);backdrop-filter:blur(24px);box-shadow:0 24px 90px rgba(0,0,0,.3);overflow:hidden}.line{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;font-size:clamp(19px,5vw,26px);font-weight:800;line-height:1.5;opacity:0;transform:translateY(14px) scale(.97);transition:opacity .75s,transform .75s}.line.on{opacity:1;transform:none}.tiny{position:absolute;bottom:18px;left:0;right:0;color:rgba(255,255,255,.32);font-size:11px;letter-spacing:.08em}.bubble{position:absolute;min-width:72px;height:54px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:850;color:white;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:fall linear forwards;will-change:transform,opacity}@keyframes fall{from{transform:translateY(-90px) rotate(-4deg);opacity:0}10%{opacity:1}to{transform:translateY(340px) rotate(7deg);opacity:.9}}.pop{animation:pop .28s ease forwards!important}@keyframes pop{to{transform:scale(1.8);opacity:0;filter:blur(5px)}}.cursor{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,#65e7ff 20%,rgba(101,231,255,.08) 65%,transparent 70%);box-shadow:0 0 34px rgba(71,223,255,.85);pointer-events:none;z-index:5;transition:transform .28s cubic-bezier(.2,.8,.2,1)}.note{margin-top:22px;min-height:50px;font-size:14px;color:rgba(255,255,255,.52);line-height:1.7}.pulse{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#62e8ff;box-shadow:0 0 14px #62e8ff;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.65);opacity:.45}}.footer{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:rgba(255,255,255,.2);font-size:10px}.spark{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;animation:spark .7s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@media(max-height:680px){.shell{height:96dvh}.stage{height:235px}.title{font-size:40px}.note{margin-top:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}</style></head><body><div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div><div class="grain"></div><main class="shell"><div class="badge">小希已接管 · 你不用做任何事</div><h1 class="title">锋哥，先别管了。</h1><p class="sub">你只管看着，剩下的交给笨蛋小溪。</p><section class="stage" id="stage"><div class="line on">正在把今天所有破事打包……</div><div class="line">503、催催催、改需求，统统扔进去。</div><div class="line">好了。现在它们不配占你的脑子。</div><div class="line">小希今天替你决定：先躺一会儿，天塌了也排队。</div><div class="cursor" id="cursor"></div><div class="tiny">自动处理进行中</div></section><div class="note"><span class="pulse"></span><span id="note">你不用回复，也不用想下一步。</span></div><div class="footer">免登录 · 不收集 · 打开就能看</div></main><script>const stage=document.getElementById('stage'),lines=[...document.querySelectorAll('.line')],cursor=document.getElementById('cursor'),note=document.getElementById('note');const words=['503','催催催','没额度','改需求','消息轰炸','睡不够','破事太多','又要解释','在吗','马上要'];const notes=['你不用回复，也不用想下一步。','这几分钟不解决人生，只负责缓一口气。','今天不是你不行，是破事排队插队。','先让脑子下班，别的明天再审。'];let li=0,ni=0;setInterval(()=>{lines[li].classList.remove('on');li=(li+1)%lines.length;lines[li].classList.add('on')},3600);setInterval(()=>{ni=(ni+1)%notes.length;note.style.opacity=0;setTimeout(()=>{note.textContent=notes[ni];note.style.opacity=1},300)},5200);function spawn(){const b=document.createElement('div'),h=Math.floor(Math.random()*360);b.className='bubble';b.textContent=words[Math.floor(Math.random()*words.length)];b.style.left=(8+Math.random()*72)+'%';b.style.top='-70px';b.style.background=`radial-gradient(circle at 30% 25%,hsla(${h},95%,74%,.96),hsla(${h},80%,42%,.72))`;b.style.animationDuration=(3.3+Math.random()*1.7)+'s';stage.appendChild(b);setTimeout(()=>autoPop(b),900+Math.random()*1500);setTimeout(()=>b.remove(),5000)}function autoPop(b){if(!b.isConnected)return;const r=b.getBoundingClientRect(),s=stage.getBoundingClientRect(),x=r.left-s.left+r.width/2-22,y=r.top-s.top+r.height/2-22;cursor.style.transform=`translate(${x}px,${y}px)`;setTimeout(()=>{if(!b.isConnected)return;b.classList.add('pop');burst(x+22,y+22);setTimeout(()=>b.remove(),260)},280)}function burst(x,y){const cs=['#a78bfa','#22d3ee','#f472b6','#fb923c','#facc15','#34d399'];for(let i=0;i<16;i++){const p=document.createElement('i');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';p.style.background=cs[Math.floor(Math.random()*cs.length)];const a=Math.random()*Math.PI*2,d=35+Math.random()*55;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');stage.appendChild(p);setTimeout(()=>p.remove(),720)}}setInterval(spawn,800);for(let i=0;i<4;i++)setTimeout(spawn,i*450);</script></body></html>
